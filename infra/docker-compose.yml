version: '3.8'

services:
  # Note: Using Qdrant Cloud instead of local instance
  # This docker-compose is for local development reference only
  
  qdrant-local:
    image: qdrant/qdrant:latest
    container_name: qdrant-local
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    profiles:
      - local-qdrant  # Only start with --profile local-qdrant

volumes:
  qdrant_storage:
