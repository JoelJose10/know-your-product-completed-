# Render Blueprint — free-tier Polylane demo
# Dashboard: New → Blueprint → repo know-your-product-completed- → branch polylane-demo
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: know-your-product-api
    runtime: python
    plan: free
    branch: polylane-demo
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MOCK_LLM
        value: "false"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: CHAT_MODEL
        value: openai/gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      - key: OPENROUTER_HTTP_REFERER
        value: https://know-your-product-web-b1pr.onrender.com
      - key: OPENROUTER_APP_TITLE
        value: Know Your Product
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: know-your-product-polylane-demo
      - key: DEMO_FORCE_CHAT_ERROR
        value: "false"

  - type: web
    name: know-your-product-web
    runtime: static
    branch: polylane-demo
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        fromService:
          name: know-your-product-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
